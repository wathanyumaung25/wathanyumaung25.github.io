<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voucher Homework</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 30px;
        }

        h1{
            margin-bottom: 20px;
        }

        form{
            background: #fff;
            width: 320px;
            margin: 0 auto 40px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        label{
            font-weight: bold;
        }

        input{
            width: 90%;
            padding: 8px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button{
            padding: 8px 20px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover{
            background: #555;
        }

        table{
            background: #fff;
            margin: 0 auto;
            width: 70%;
            border-collapse: collapse;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        th{
            background: #222;
            color: #fff;
            padding: 10px;
        }

        td{
            padding: 10px;
            text-align: center;
            border-bottom: 1px dashed #999;
        }
    </style>
</head>

<body>

<h1>Yangon Tea Shop</h1>

<form onsubmit="registerFood(); return false;">
    <label>Name</label><br>
    <input type="text" id="foodname"><br>

    <label>Price</label><br>
    <input type="number" id="price"><br>

    <label>Qty</label><br>
    <input type="number" id="qty"><br><br>

    <button type="submit">Submit</button>
</form>

<h1>Yangon Tea Shop Slip</h1>

<table border="1">
    <thead>
        <tr>
            <th>No.</th>
            <th>Food Name</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Total</th>
        </tr>
    </thead>
    <tbody id="tbody"></tbody>
</table>

<script>
let forms = [];

function registerFood() {

    let foodname = document.getElementById("foodname");
    let price = document.getElementById("price");
    let qty = document.getElementById("qty");

    let valid = true;

    // Food Name validation
    if (foodname.value.trim() === "") {
        foodname.style.border = "2px solid red";
        valid = false;
    } else {
        foodname.style.border = "2px solid green";
    }

    // Price validation
    if (price.value === "" || price.value <= 0) {
        price.style.border = "2px solid red";
        valid = false;
    } else {
        price.style.border = "2px solid green";
    }

    // Qty validation
    if (qty.value === "" || qty.value <= 0) {
        qty.style.border = "2px solid red";
        valid = false;
    } else {
        qty.style.border = "2px solid green";
    }

    if (!valid) {
        alert("Please fill all fields correctly");
        return false;
    }

    let form = {
        foodname: foodname.value,
        price: price.value,
        qty: qty.value,
        total: price.value * qty.value
    };

    forms.push(form);

    let table = "";
    for (let i = 0; i < forms.length; i++) {
        table += `
            <tr>
                <td>${i + 1}</td>
                <td>${forms[i].foodname}</td>
                <td>${forms[i].price}</td>
                <td>${forms[i].qty}</td>
                <td>${forms[i].total}</td>
            </tr>
        `;
    }

    document.getElementById("tbody").innerHTML = table;

    foodname.value = "";
    price.value = "";
    qty.value = "";

    foodname.style.border = "";
    price.style.border = "";
    qty.style.border = "";
}
</script>

</body>
</html>
